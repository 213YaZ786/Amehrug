# Publishes a signed APK when a tag like v0.6.1 is pushed.
# Action versions read on the official repositories on 2026-09-17.
#
# Signing needs four repository secrets. Without them the workflow still
# publishes, but an unsigned APK, which no phone will install. See
# docs/03-RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # A tag that does not match versionName would ship a file whose name
      # lies about what is inside it.
      - name: Check the tag against versionName
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName $VERSION, tag $TAG"
          if [ "$VERSION" != "$TAG" ]
          then
            echo "The tag and versionName differ. Bump one of them."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore the signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amehrug.jks"
          echo "AMEHRUG_KEYSTORE=$RUNNER_TEMP/amehrug.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          AMEHRUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AMEHRUG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AMEHRUG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Check release permissions
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -E "uses-permission" permissions.txt | grep -v "com.amehrug.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          then
            echo "Unexpected permission in the release APK"
            exit 1
          fi

      - name: Name the file and note its fingerprint
        run: |
          mkdir -p release
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          if [ -n "${AMEHRUG_KEYSTORE:-}" ]
          then
            NAME="Amehrug-$VERSION.apk"
          else
            NAME="Amehrug-$VERSION-unsigned.apk"
          fi
          cp "$APK" "release/$NAME"
          ( cd release && sha256sum "$NAME" > "$NAME.sha256" )
          cat "release/$NAME.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Amehrug $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: amehrug-release
          path: release/*
          if-no-files-found: error
