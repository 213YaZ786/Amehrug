# Builds on every push and pull request, and publishes a release for every
# green build on main.
#
# Action versions read on the official repositories on 2026-09-17:
# actions/checkout v6, actions/setup-java v5, actions/upload-artifact v7,
# gradle/actions v6.
# gradle/actions/setup-gradle is not used: since v6 its cache is a closed
# source library. setup-java caches Gradle with the open source actions/cache.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The GitHub web uploader drops the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read the version
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          echo "versionName $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Says out loud which of the four secrets the run can see, by name and
      # never by value, and restores the key when all four are there. Both
      # naming schemes are accepted, ANDROID_KEYSTORE_BASE64 and the shorter
      # KEYSTORE_BASE64, because either is a reasonable thing to have typed.
      #
      # A pull request from a fork or from Dependabot sees no secret at all,
      # which is normal and only means it builds without signing.
      - name: Check the signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          missing=
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          do
            if [ -n "${!name}" ]
            then
              echo "$name: present"
            else
              echo "$name: MISSING"
              missing=1
            fi
          done
          if [ -n "$missing" ]
          then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amehrug.jks"
          if [ ! -s "$RUNNER_TEMP/amehrug.jks" ]
          then
            echo "::error::The keystore secret is not valid base64."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "keystore restored, $(stat -c%s "$RUNNER_TEMP/amehrug.jks") bytes"
          echo "AMEHRUG_KEYSTORE=$RUNNER_TEMP/amehrug.jks" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          AMEHRUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          AMEHRUG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          AMEHRUG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleDebug assembleRelease testDebugUnitTest

      - name: Name the files and note their fingerprints
        run: |
          mkdir -p release
          for file in app/build/outputs/apk/release/*.apk
          do
            base="$(basename "$file" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$file" "release/Amehrug-$VERSION-$abi.apk"
          done
          ( cd release && sha256sum ./*.apk > SHA256SUMS.txt )
          cat release/SHA256SUMS.txt

      # The only permission allowed is the one AndroidX core declares for
      # its own non exported receivers. Anything else fails the build.
      - name: Check release permissions
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$AAPT2" dump permissions "release/Amehrug-$VERSION-universal.apk" | tee permissions.txt
          if grep -E "uses-permission" permissions.txt | grep -v "com.amehrug.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          then
            echo "Unexpected permission in the release APK"
            exit 1
          fi

      - name: Upload the debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: amehrug-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the release APKs
        uses: actions/upload-artifact@v7
        with:
          name: amehrug-release
          path: release/*
          if-no-files-found: error

      # One release per green build on main. The first build of a version
      # takes the plain tag, the next ones carry the run number, so a release
      # is never overwritten and the history stays readable.
      - name: Publish the release
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          TITLE="Amehrug $VERSION"
          if gh release view "$TAG" > /dev/null 2>&1
          then
            TAG="v$VERSION-b$GITHUB_RUN_NUMBER"
            TITLE="Amehrug $VERSION (build $GITHUB_RUN_NUMBER)"
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --generate-notes
          echo "published $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url

      # Red on purpose. A build that cannot publish used to pass quietly,
      # which reads as "it worked" while nothing was released.
      - name: Fail when a push could not be published
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.ready != 'true' }}
        run: |
          echo "::error::No release: the signing secrets are missing or unreadable."
          echo "Read the Check the signing secrets step above to see which one."
          echo "Names accepted: ANDROID_KEYSTORE_BASE64 or KEYSTORE_BASE64, and the"
          echo "matching PASSWORD, ALIAS and KEY_PASSWORD. See docs/03-RELEASING.md."
          exit 1
