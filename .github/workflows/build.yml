# Action versions read on the official repositories on 2026-09-17:
# actions/checkout v6, actions/setup-java v5, actions/upload-artifact v7,
# gradle/actions v6.
# gradle/actions/setup-gradle is not used: since v6 its cache is a closed
# source library. setup-java caches Gradle with the open source actions/cache.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The GitHub web uploader drops the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --stacktrace assembleDebug assembleRelease testDebugUnitTest

      # The only permission allowed is the one AndroidX core declares for
      # its own non exported receivers. Anything else fails the build.
      - name: Check release permissions
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -E "uses-permission" permissions.txt | grep -v "com.amehrug.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          then
            echo "Unexpected permission in the release APK"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: amehrug-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: amehrug-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
